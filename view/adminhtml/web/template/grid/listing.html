<!-- Magento_Ui/grid/listing with an empty state for tables that have no records yet. -->
<div class="admin__data-grid-wrap" data-role="grid-wrapper">
    <table class="data-grid" data-role="grid">
       <thead>
            <tr each="data: getVisible(), as: '$col'" render="getHeader()"></tr>
        </thead>
        <tbody>
            <tr if="rows" class="data-row" repeat="foreach: rows, item: '$row'" css="'_odd-row': $index % 2">
                <td if="$row()" outerfasteach="data: getVisible(), as: '$col'"
                    css="getFieldClass($row())" click="getFieldHandler($row())" template="getBody()"></td>
            </tr>
            <tr ifnot="hasData()" class="data-grid-tr-no-data">
                <td attr="colspan: countVisible()">
                    <div if="showEmptyState()" class="commercegears-empty-state">
                        <p class="commercegears-empty-state-title" text="emptyTitle"></p>
                        <p class="commercegears-empty-state-text" text="emptyText"></p>
                        <a if="emptyActionUrl" class="action-primary commercegears-empty-state-action"
                           attr="href: emptyActionUrl" text="emptyActionLabel"></a>
                    </div>
                    <span ifnot="showEmptyState()" translate="'We couldn\'t find any records.'"></span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
